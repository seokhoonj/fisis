[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fisis"
version = "0.1.0"
description = "Python client for the FISIS (Financial Supervisory Service Financial Statistics Information System) Open API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords = ["fisis", "fss", "financial statistics", "korea", "finance", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
fisis = "fisis.cli:main"

[project.urls]
Homepage = "https://github.com/seokhoonj/fisis"
Source = "https://github.com/seokhoonj/fisis"
Issues = "https://github.com/seokhoonj/fisis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fisis"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

# polars / pandas are optional (imported lazily by Table.to_polars / to_pandas);
# they need not be installed to type-check this package, so their absent stubs are
# not an error here. A caller who uses the converters has the library installed,
# and their own checker then resolves the real DataFrame type from the annotations.
[[tool.mypy.overrides]]
module = ["polars", "polars.*", "pandas", "pandas.*"]
ignore_missing_imports = true
